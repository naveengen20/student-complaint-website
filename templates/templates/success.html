<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaint Submitted</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #eef7f0;
            padding: 20px;
        }

        .box {
            background: white;
            width: 100%;
            max-width: 500px;
            text-align: center;
            padding: 45px 30px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
        }

        .check {
            width: 70px;
            height: 70px;
            line-height: 70px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #28a745;
            color: white;
            font-size: 38px;
        }

        h1 {
            color: #218838;
        }

        .id {
            display: inline-block;
            margin: 15px 0;
            padding: 12px 24px;
            background: #f1f5ff;
            border-radius: 8px;
            font-size: 25px;
            font-weight: bold;
            color: #1d55c7;
            letter-spacing: 3px;
        }

        a {
            display: block;
            margin-top: 22px;
            text-decoration: none;
            color: white;
            background: #1d55c7;
            padding: 12px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="check">✓</div>

    <h1>Complaint Submitted Successfully!</h1>

    <p>Your complaint has been recorded.</p>

    <p>Your Complaint ID is:</p>

    <div class="id">{{ complaint_id }}</div>

    <p>Please save this ID for future reference.</p>

    <a href="/">Submit Another Complaint</a>

</div>

</body>
</html>
